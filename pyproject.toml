[project]
name = "trysac-trace-sampling-policy"
version = "0.1.0"  # static: generated code may rewrite __init__.py (L35)
description = "Tail-based trace sampling policies: ordered keep rules for errors, latency, attributes, trace-id ratio and rate limits, a bounded decision buffer and cached late-span decisions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Gomez" }]
keywords = ["trace-sampling-policy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Trysac/u236-trace-sampling-policy"
Source = "https://github.com/Trysac/u236-trace-sampling-policy"
Issues = "https://github.com/Trysac/u236-trace-sampling-policy/issues"
Changelog = "https://github.com/Trysac/u236-trace-sampling-policy/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_sampling_policy"]

[tool.hatch.build.targets.sdist]
# Ship the library, its tests and its docs; never the factory's internal files.
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]  # long verbatim literals (L29); fake test tokens, gitleaks still scans (L32)

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "conformance: needs an external tool or download; runs only in CI (FABRICA_CI=1)",
]

[tool.coverage.run]
source = ["trace_sampling_policy"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
